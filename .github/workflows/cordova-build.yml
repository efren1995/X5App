name: Matrix Ecosystem CI/CD

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  lint-and-validate:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: 'npm'

      - name: Validate Core Project Files
        run: |
          echo "[+] Checking workspace structure..."
          test -f www/js/index.js && echo "[OK] index.js present"
          test -f bridge_daemon.py && echo "[OK] bridge_daemon.py present"
          npm install --silent || true

  build-android:
    needs: lint-and-validate
    runs-on: ubuntu-24.04

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v5
      with:
        node-version: '20'
        cache: 'npm'

    - name: Set up JDK 17
      uses: actions/setup-java@v5
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Install Cordova CLI
      run: npm install -g cordova

    - name: Install Dependencies
      run: npm install

    - name: Force Clean and Prepare Android Platform
      run: |
        npx cordova platform rm android || true
        rm -rf platforms/android
        npx cordova platform add android --save

    - name: Build Debug APK
      run: npx cordova build android --debug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: matrix-app-debug
        path: platforms/android/app/build/outputs/apk/debug/app-debug.apk
